name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Full Flutter App
        run: |
          mkdir -p temp_app
          flutter create --org com.example temp_app
          if [ -f main.dart ]; then cp main.dart temp_app/lib/main.dart; fi
          if [ -d lib ]; then cp -r lib/* temp_app/lib/; fi
          cd temp_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
